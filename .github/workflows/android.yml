name: Build Debug APK
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unzip & Build APK
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -o "$z" -x ".github/*"; done
          PROJ=$(find . -name "settings.gradle.kts" | head -n 1)
          cd "$(dirname "$PROJ")"
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ivtr261-debug-apk
          path: "**/app-debug.apk"
